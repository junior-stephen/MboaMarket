<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mboa Market</title>

    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">

    <!--GESTION DU CSS-->
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <!--ENTETE DE LA PAGE-->
    <header id="entete">
        <div class="container">
            <div id="logo">
                <a href="#">Mboa <span>Market</span></a>
            </div>
            <div id="menu">
                <a href="#" id="btn_panier">
                    Panier<span><i class="fa-solid fa-cart-shopping"></i></span>
                    <span id="nb_articles" class="hide">0</span>
                </a>
            </div>
        </div>
    </header>

    <!--Conteneur de la page-->
    <main id="container">

        <!--SECTION CARROUSEL-->
        <section id="carroussel"></section>

            <!-- SECTION BOUTIQUE -->
            <section id="boutique">
                <div class="boutique_entete">
                    <h2>Nos Produits du marché</h2>
                    <p id="nb_resultats"></p>
                </div>

                <!--Filtre de recherche de produits-->
                <div class="boutique_outils">
                    <div class="recherche">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" id="recherche" placeholder="Rechercher : poivre blanc, poulet..." />
                    </div>
                    <select id="tri">
                        <option value="default">Trier par : recommandés</option>
                        <option value="prix_croissant">Prix croissant</option>
                        <option value="prix_decroissant">Prix décroissant</option>
                        <option value="nom">Nom (A -> Z)</option>
                    </select>
                </div>
                <!--Lsite des categories-->
                <div id="categories"></div>

                 <!--Lsite des produits-->
                <div id="produits"></div>
            </section>

            <!--BOUTONS D'OPTIONS DES SLIDES-->

        </section>
    </main>

    <footer>
        <p>
            <b>Mboa <span>Market</span></b>
            Le gout de l'Afrique chez vous ! 
        </p>
        <p>
            Tel : +237 6 83 70 76 27 | Email : contact@mbaomarket.com
        </p>
    </footer>
        

    <!--GESTION DU JAVASCRIPT-->
    <script type="text/javascript" src="js/carroussel.js"></script>
    <script type="text/javascript" src="js/boutique.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
