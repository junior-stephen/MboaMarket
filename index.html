    <title>Mboa Market</title>

    <link rel="stylesheet" href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css">

    <!--GESTION DU CSS-->
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <!--ENTETE DE LA PAGE-->
    <header id="entete">
        <div class="container">
            <div id="logo">
                <a href="#">Mboa <span>Market</span></a>     
            </div>
            <div id="menu">

                        <p>
                            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Veritatis 
                            fugiat, tenetur asperiores nulla iusto dicta doloribus illo ratione
                            in, delectus quaerat quae commodi id maiores recusandae sint, labore 
                            repudiandae repellendus!
                        </p>
                        <div class="buttons">
                            <a href="#"> En savoir plus</a>
                        </div>
                    </div>
                </div>
            </div>

<!--BOUTONS D'OPTIONS DES SLIDES-->
            <div class="slide_options">
                <span class="slide_left">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>
                <span class="slide_right">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>
            </div>

    </main>

    <!--GESTION DU JAVASCRIPT-->
